# Установка: uv run pre-commit install
# Прогон по всему репозиторию: uv run pre-commit run --all-files
default_install_hook_types: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=512]
      - id: detect-private-key

  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.1
    hooks:
      - id: uv-lock

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.28.0
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: forbid-secrets
        name: запрет коммита .env, *.session и данных
        language: fail
        entry: "Секреты и данные не коммитим (.env, *.session, data/). Уберите файл из индекса: git rm --cached <file>"
        files: '(^|/)(\.env(\..+)?|.+\.session(-journal)?|data/.+)$'
        exclude: '(^|/)(\.env\.example|data/\.gitkeep)$'

      - id: pyright
        name: pyright (strict)
        language: system
        entry: uv run --frozen pyright
        types: [python]
        pass_filenames: false
