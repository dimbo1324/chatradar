# docker compose up -d --build                      — start web and worker
# docker compose run --rm -it worker telegram login — first Telegram login
name: chatradar

x-app: &app
  build: .
  image: chatradar:local
  env_file:
    - path: .env
      required: false
  volumes:
    - ./data:/app/data
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  web:
    <<: *app
    command: ["web", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8000:8000" # loopback only; expose through a reverse proxy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    command: ["worker"]

