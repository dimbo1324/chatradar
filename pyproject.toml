[project]
name = "chatimport"
version = "0.0.1"
description = "Local, reactive export of chosen Telegram groups and channels to chunked JSONL."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "dimbo1324" }]
keywords = ["telegram", "export", "jsonl", "archive", "telethon"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "filelock>=4.2.4",
    "pillow>=13.0.0",
    "platformdirs>=4.14.0",
    "pystray>=0.19.5",
    "telethon>=1.45,<2",
    "typer>=0.27.3",
]

[project.scripts]
chatimport = "chatimport.cli:run"

[project.urls]
Repository = "https://github.com/dimbo1324/chatradar/tree/chatimport"
Issues = "https://github.com/dimbo1324/chatradar/issues"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

# ---------------------------------------------------------------- uv
[tool.uv]
default-groups = ["dev"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["src", "tests", "scripts"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "C4",       # comprehensions
    "PTH",      # pathlib
    "DTZ",      # naive datetimes — every date is timezone-aware
    "T20",      # leftover print
    "S",        # bandit (security)
    "TC",       # type-only imports
    "PT",       # pytest style
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.isort]
known-first-party = ["chatimport", "scripts"]

[tool.ruff.format]
docstring-code-format = true

# ---------------------------------------------------------------- pyright
[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false
reportPrivateUsage = "warning"

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: tests over a temporary folder tree and a fake Telegram client",
]
filterwarnings = ["error"]

# ---------------------------------------------------------------- coverage
[tool.coverage.run]
source = ["chatimport"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
